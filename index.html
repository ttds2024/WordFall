<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a1a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%2715%27 y=%272%27 width=%273%27 height=%276%27 fill=%27%233f6b2a%27/%3E%3Cellipse cx=%2716%27 cy=%2719%27 rx=%2714%27 ry=%2712%27 fill=%27%23ff7a18%27/%3E%3C/svg%3E"
    />
    <title>WordFall</title>
  </head>
  <body>
    <main id="app">
      <header class="hud">
        <div class="score">
          <span class="score-label" data-i18n="score"></span>
          <span id="score">0</span>
        </div>
        <div class="word-box">
          <div id="word" class="word" aria-live="polite"></div>
          <div id="status" class="status"></div>
        </div>
        <button id="settings-button" class="icon-button" type="button">⚙</button>
      </header>
      <div class="field-wrap">
        <canvas id="field"></canvas>
        <div id="toast" class="toast" aria-live="polite"></div>
      </div>
      <footer class="controls">
        <button id="clear-button" type="button" data-i18n="clear"></button>
        <button id="submit-button" class="primary" type="button" data-i18n="submit"></button>
      </footer>
      <dialog id="settings">
        <form method="dialog">
          <h2 data-i18n="settings"></h2>
          <fieldset>
            <legend data-i18n="submitMode"></legend>
            <label>
              <input type="radio" name="mode" value="button" />
              <span><b data-i18n="modeButton"></b><small data-i18n="modeButtonHint"></small></span>
            </label>
            <label>
              <input type="radio" name="mode" value="auto" />
              <span><b data-i18n="modeAuto"></b><small data-i18n="modeAutoHint"></small></span>
            </label>
          </fieldset>
          <fieldset>
            <legend data-i18n="language"></legend>
            <label>
              <input type="radio" name="lang" value="en" />
              <span><b>English</b></span>
            </label>
            <label>
              <input type="radio" name="lang" value="ru" />
              <span><b>Русский</b><small id="ru-note"></small></span>
            </label>
          </fieldset>
          <button class="primary" value="done" data-i18n="done"></button>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
