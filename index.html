<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131f24" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@700;800;900&family=Press+Start+2P&display=swap"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%2715%27 y=%272%27 width=%273%27 height=%276%27 fill=%27%233f6b2a%27/%3E%3Cellipse cx=%2716%27 cy=%2719%27 rx=%2714%27 ry=%2712%27 fill=%27%23ff7a18%27/%3E%3C/svg%3E"
    />
    <title>WordFall</title>
  </head>
  <body>
    <main id="app">
      <header class="hud">
        <!-- Your score, the round timer as a ring and, against the bot, its score. -->
        <div class="versus">
          <!-- Each side: the avatar with the name under it, and the score. -->
          <div class="vs-card vs-you">
            <span class="vs-who">
              <span id="vs-avatar" class="vs-avatar"></span>
              <span class="vs-label" data-i18n="you"></span>
            </span>
            <b id="vs-you-score" class="vs-score">0</b>
          </div>
          <div id="vs-ring" class="vs-ring" role="img">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <circle class="vs-ring-track" cx="32" cy="32" r="28" />
              <circle
                id="vs-ring-fill"
                class="vs-ring-fill"
                cx="32"
                cy="32"
                r="28"
                pathLength="100"
              />
            </svg>
            <span class="vs-seconds">
              <b id="vs-seconds"></b>
              <small data-i18n="sec"></small>
            </span>
          </div>
          <div class="vs-card vs-bot">
            <b id="vs-bot-score" class="vs-score">0</b>
            <span class="vs-who">
              <span class="vs-avatar"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <rect x="4" y="8" width="16" height="11" rx="3" />
                  <path d="M12 8V4" />
                  <circle cx="12" cy="3" r="1" />
                  <circle cx="9" cy="13" r="1.3" />
                  <circle cx="15" cy="13" r="1.3" /></svg
              ></span>
              <span class="vs-label" data-i18n="bot"></span>
            </span>
          </div>
        </div>
        <div class="word-box">
          <!-- Stars collected this round, under your avatar: tap to put one into the word. -->
          <button id="joker-button" class="joker-button" type="button">
            <span class="joker-star" aria-hidden="true"></span>
            <b id="joker-count" class="joker-count">0</b>
          </button>
          <div class="word-line">
            <div id="word" class="word" aria-live="polite"></div>
            <span id="multiplier" class="multiplier" hidden></span>
          </div>
          <div id="status" class="status"></div>
        </div>
        <div class="hud-buttons">
          <button id="menu-button" class="icon-button" type="button">☰</button>
        </div>
      </header>
      <div class="field-wrap">
        <canvas id="field"></canvas>
        <div id="toast" class="toast" aria-live="polite"></div>
      </div>
      <section id="menu" class="menu">
        <!-- Shown while a round is paused: closes the menu and resumes the game. -->
        <button id="menu-close" class="icon-button menu-close" type="button" hidden>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
        <h1 data-i18n="title"></h1>
        <div id="account" class="account" hidden>
          <div id="signed-out" class="sign-in">
            <span class="sign-in-label" data-i18n="signInWith"></span>
            <div class="sign-in-buttons">
              <button id="sign-in-yandex" class="provider yandex" type="button" hidden>
                Yandex ID
              </button>
              <button id="sign-in-vk" class="provider vk" type="button" hidden>VK ID</button>
            </div>
          </div>
          <div id="signed-in" class="profile" hidden>
            <img id="profile-avatar" class="avatar" alt="" referrerpolicy="no-referrer" hidden />
            <span class="profile-text">
              <b id="profile-name"></b>
              <small id="profile-via"></small>
            </span>
            <button id="sign-out" type="button" data-i18n="signOut"></button>
          </div>
          <div id="auth-error" class="auth-error" aria-live="polite" hidden></div>
        </div>
        <div class="menu-options">
          <button id="play-timed" class="primary" type="button">
            <b data-i18n="playTimed"></b>
            <small data-i18n="playTimedHint"></small>
          </button>
          <button id="play-bot" type="button">
            <b data-i18n="playBot"></b>
            <small data-i18n="playBotHint"></small>
          </button>
        </div>
        <div class="menu-links">
          <!-- Shown when the game has a backend to keep scores in. -->
          <button id="menu-board" type="button" data-i18n="leaderboard" hidden></button>
          <button id="menu-settings" type="button" data-i18n="settings"></button>
        </div>
      </section>
      <!-- The best scores, in the game's language. -->
      <dialog id="board" class="board">
        <form method="dialog">
          <h2 data-i18n="leaderboard"></h2>
          <div class="board-tabs" role="tablist">
            <button id="board-solo" type="button" role="tab" data-i18n="boardSolo"></button>
            <button id="board-bot" type="button" role="tab" data-i18n="boardBot"></button>
          </div>
          <ol id="board-rows" class="board-rows" hidden></ol>
          <p id="board-note" class="board-note" aria-live="polite"></p>
          <div class="field">
            <label class="field-label" for="board-name" data-i18n="boardName"></label>
            <input id="board-name" type="text" autocomplete="nickname" />
          </div>
          <button class="primary" value="done" data-i18n="done"></button>
        </form>
      </dialog>
      <dialog id="settings">
        <form method="dialog">
          <h2 data-i18n="settings"></h2>
          <div class="field">
            <label class="field-label" for="lang-select" data-i18n="language"></label>
            <select id="lang-select" name="lang">
              <option value="en">English</option>
              <option id="lang-ru" value="ru">Русский</option>
            </select>
          </div>
          <fieldset>
            <legend data-i18n="sound"></legend>
            <label>
              <input type="radio" name="sound" value="on" />
              <span><b data-i18n="soundOn"></b></span>
            </label>
            <label>
              <input type="radio" name="sound" value="off" />
              <span><b data-i18n="soundOff"></b></span>
            </label>
          </fieldset>
          <fieldset>
            <legend data-i18n="theme"></legend>
            <label>
              <input type="radio" name="theme" value="halloween" />
              <span><b data-i18n="themeHalloween"></b></span>
            </label>
            <label>
              <input type="radio" name="theme" value="8bit" />
              <span><b data-i18n="theme8bit"></b></span>
            </label>
            <label>
              <input type="radio" name="theme" value="christmas" />
              <span><b data-i18n="themeChristmas"></b></span>
            </label>
          </fieldset>
          <button class="primary" value="done" data-i18n="done"></button>
        </form>
      </dialog>
      <!-- The result of a finished round, over the start menu. -->
      <dialog id="result" class="result">
        <form method="dialog">
          <h2 id="result-title" class="result-title"></h2>
          <div class="result-scores">
            <div class="result-score">
              <span data-i18n="finalScore"></span>
              <b id="result-score"></b>
            </div>
            <div id="result-bot-box" class="result-score result-bot" hidden>
              <span data-i18n="bot"></span>
              <b id="result-bot"></b>
            </div>
          </div>
          <div class="result-actions">
            <button class="primary" value="again" data-i18n="playAgain"></button>
            <button value="menu" data-i18n="menu"></button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
