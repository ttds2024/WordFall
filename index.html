<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a1a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%2715%27 y=%272%27 width=%273%27 height=%276%27 fill=%27%233f6b2a%27/%3E%3Cellipse cx=%2716%27 cy=%2719%27 rx=%2714%27 ry=%2712%27 fill=%27%23ff7a18%27/%3E%3C/svg%3E"
    />
    <title>WordFall</title>
  </head>
  <body>
    <main id="app">
      <header class="hud">
        <div class="score">
          <span class="score-label" data-i18n="score"></span>
          <span id="score">0</span>
          <span id="timer" class="timer"></span>
        </div>
        <div class="word-box">
          <div class="word-line">
            <div id="word" class="word" aria-live="polite"></div>
            <span id="multiplier" class="multiplier" hidden></span>
          </div>
          <div id="status" class="status"></div>
        </div>
        <div class="hud-buttons">
          <button id="menu-button" class="icon-button" type="button">☰</button>
          <button id="settings-button" class="icon-button" type="button">⚙</button>
        </div>
      </header>
      <div class="field-wrap">
        <canvas id="field"></canvas>
        <div id="toast" class="toast" aria-live="polite"></div>
      </div>
      <section id="menu" class="menu">
        <h1 data-i18n="title"></h1>
        <div id="result" class="result" hidden>
          <div id="result-title" class="result-title"></div>
          <div class="result-score">
            <span data-i18n="finalScore"></span>
            <b id="result-score"></b>
          </div>
        </div>
        <div class="menu-options">
          <button id="play-timed" class="primary" type="button">
            <b data-i18n="playTimed"></b>
            <small data-i18n="playTimedHint"></small>
          </button>
          <button id="play-endless" type="button">
            <b data-i18n="playEndless"></b>
            <small data-i18n="playEndlessHint"></small>
          </button>
        </div>
        <button id="menu-settings" type="button" data-i18n="settings"></button>
      </section>
      <dialog id="settings">
        <form method="dialog">
          <h2 data-i18n="settings"></h2>
          <fieldset>
            <legend data-i18n="language"></legend>
            <label>
              <input type="radio" name="lang" value="en" />
              <span><b>English</b></span>
            </label>
            <label>
              <input type="radio" name="lang" value="ru" />
              <span><b>Русский</b><small id="ru-note"></small></span>
            </label>
          </fieldset>
          <button class="primary" value="done" data-i18n="done"></button>
        </form>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
