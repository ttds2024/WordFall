name: Supabase

# Applies the database migrations in supabase/ to the project. It does nothing until the project
# is named: set the variable SUPABASE_PROJECT_REF and the secrets SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD (see the README).

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      # Without the secrets there is nothing to sign in with: say so and stop, without failing.
      - id: ready
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set; skipped."
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.ready.outputs.ok == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - if: steps.ready.outputs.ok == 'true'
        run: supabase db push
