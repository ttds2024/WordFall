# Supabase project settings for WordFall. The project itself is linked in CI by its ref
# (.github/workflows/supabase.yml), so nothing here names it.
project_id = "wordfall"

# Called before the player has a session, so there is no JWT to check; the function checks the
# Yandex ID / VK ID token itself.
[functions.provider-login]
verify_jwt = false
